services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: db_epis
    ports:
      - "6333:6333" # HTTP API & Dashboard
      - "6334:6334" # gRPC API (Used by many Vector DB clients)
    environment:
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      # Named volume: data lives inside Docker's Linux VM, so macOS
      # filesystem issues and .DS_Store pollution can't corrupt it
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  qdrant_data: